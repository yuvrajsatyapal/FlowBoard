name: Keep Alive

on:
  schedule:
    - cron: '*/10 * * * *'  # every 10 minutes
  workflow_dispatch:          # allow manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend
        run: |
          curl -sf "${{ secrets.BACKEND_URL }}/api/health" \
            --max-time 30 \
            --retry 2 \
            || echo "Backend ping failed or timed out (service may have been cold)"

      - name: Ping frontend
        run: |
          curl -sf "${{ secrets.FRONTEND_URL }}" \
            --max-time 30 \
            --retry 2 \
            || echo "Frontend ping failed or timed out"
