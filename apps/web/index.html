    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />

    <!-- ── Fonts — single consolidated request ───────────────────────────── -->
    <!--
      All five families in ONE request (saves 1 DNS + TLS round-trip).
      Anton: landing page display headline
      Geist + Geist Mono: app UI + code
      Hanken Grotesk: landing page body copy
      Inter: app UI body text
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&family=Hanken+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap"

    />
